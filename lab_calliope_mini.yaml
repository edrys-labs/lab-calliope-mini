  - url: https://edrys-labs.github.io/module-markdown-it/index.html
    config:
      content: |-
        # Simulatorübung

        Hier entwickeln Sie die Wetteranzeige aus der Hauptaufgabe. Der Simulator bildet einen Calliope mini 3 nach: LED-Matrix, Taster und Pins funktionieren wie auf dem realen Gerät. Die Ausgaben von `print()` erscheinen im Terminal unter der Platine.

        Die Umweltdaten stellen Sie mit den Schiebereglern unter der Platine ein: die Temperatur zwischen 0 und 40 °C und die Helligkeit zwischen 0 und 255. Die Taster A und B drücken Sie per Mausklick auf der Platine. Das nebenstehende Programm liest die Temperatur jede Sekunde aus und gibt sie über die serielle Schnittstelle aus. Starten Sie es mit dem Ausführen-Knopf im Editor und verändern Sie die Temperatur.

        > **Praktische Aufgabe 1**: Erweitern Sie das Programm zu einer Wetteranzeige: Zeigen Sie über 25 °C ein fröhliches Gesicht (`Image.HAPPY`), unter 15 °C ein trauriges (`Image.SAD`) und dazwischen ein schlafendes (`Image.ASLEEP`).

        > **Praktische Aufgabe 2**: Erkennen Sie, wenn sich die Temperatur zwischen zwei Messungen um mehr als 2 °C ändert. Zeigen Sie in diesem Fall kurz einen Pfeil in Richtung der Änderung (`Image.ARROW_N` bzw. `Image.ARROW_S`) und geben Sie eine Warnung über die serielle Schnittstelle aus. Prüfen Sie Ihr Programm, indem Sie den Schieberegler schnell und langsam verschieben.

        > **Konzeptionelle Aufgabe 1**: Die Funktion `temperature()` liefert die Temperatur des Prozessors, nicht die der Umgebung. Überlegen Sie, wie sich das auf Ihre Messwerte auf dem realen Gerät auswirkt, und wie häufig eine Messung für eine Wetteranzeige sinnvoll ist.

        ## Vorbereitung auf das Remote-Labor

        Wenn Ihre Wetteranzeige im Simulator funktioniert, kopieren Sie den Code in den Editor der Station und führen Sie ihn auf dem realen Calliope mini aus. Dort lassen sich die Sensorwerte nicht verändern und die Taster nicht drücken. Testen Sie deshalb alle Zweige Ihres Programms hier im Simulator, auch die Erweiterungen aus Raum 1 (die Helligkeit lesen Sie mit `display.read_light_level()` aus).
