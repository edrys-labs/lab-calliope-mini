  - url: https://edrys-labs.github.io/module-markdown-it/index.html
    config:
      content: |-
        # Calliope Mini Einstieg mit MicroPython

        > Diese Station zielt darauf ab, Ihre Fähigkeiten im Umgang mit eingebetteten Systemen zu fördern. Sie programmieren den Calliope mini mit MicroPython, um grundlegende Funktionen wie Umweltsensorabfrage und Ausgabe über die LED-Matrix zu realisieren.

        Der Calliope mini 3 basiert auf einem Nordic nRF52833 Mikrocontroller. Die Sensoren und Aktoren sind direkt über die MicroPython API ansprechbar.

        Ziel ist es, sich mit der Plattform vertraut zu machen, Sensorwerte auszulesen, diese auf der LED-Matrix anzuzeigen und einfache Logik zu implementieren.

        ## Remote-Labor

        > **Praktische Aufgabe 3**: Führen Sie zunächst den folgenden Ausgangscode aus. Er gibt Temperatur und Helligkeit des realen Calliope mini jede Sekunde über die serielle Schnittstelle aus. Vergleichen Sie die Werte mit denen, die Sie im Simulator eingestellt haben.

        > **Praktische Aufgabe 4**: Führen Sie Ihre im Simulator entwickelte Wetteranzeige auf der Station aus. Prüfen Sie über die Kamera, ob das passende Symbol auf der LED-Matrix erscheint.

        > **Konzeptionelle Aufgabe 2**: Warum ändern sich die Messwerte auf der Station kaum? Wie würden Sie Ihr Programm auf einem realen Gerät testen, dessen Umgebung Sie nicht beeinflussen können?

        **Ausgangscode**

        ```python
        from calliopemini import *

        while True:
            print('Temperatur:', temperature(), 'Helligkeit:', display.read_light_level())
            sleep(1000)
        ```
