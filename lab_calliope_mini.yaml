    config:
      content: |-
        # Aufgabeninhalt

        ## Lernziele

        * Erste Schritte mit der Programmierung von eingebetteten Systemen in MicroPython
        * Kennenlernen der Hardware-Funktionen des Calliope mini (Sensoren, LED-Matrix, Taster)
        * Auslesen von Umweltsensoren und Darstellung der Messwerte auf der LED-Matrix
        * Entwicklung strukturierter, wiederverwendbarer Programme in MicroPython
        * Nutzung der seriellen Schnittstelle zur Kommunikation und Fehleranalyse

        ## Aufgabenstellung

        > **Hauptaufgabe**: Entwickeln Sie eine Wetteranzeige, die die Temperatur regelmäßig misst, sie über ein Symbol auf der LED-Matrix darstellt und starke Temperaturänderungen zwischen zwei Messungen erkennt und anzeigt.

        Die einzelnen Schritte finden Sie in der Simulatorübung in **Raum 2**. Wenn Ihre Wetteranzeige funktioniert, können Sie sie erweitern, zum Beispiel:

        * Eine Alarmfunktion, die bei Dunkelheit ein Warnsymbol auf der LED-Matrix zeigt.
        * Ein Umschalten zwischen Temperatur- und Helligkeitsanzeige über die Taster A und B.
        * Eine kontinuierliche Übertragung der Messwerte über die serielle Schnittstelle, z. B. als Tabelle mit Zeitstempel.

        Sie können auch eigene Ideen umsetzen und weitere Funktionen des Calliope mini ausprobieren.

        ## Simulator und Station

        Im Simulator (**Raum 2**) stellen Sie Temperatur und Helligkeit mit Schiebereglern ein und bedienen die Taster per Mausklick. So können Sie jeden Zweig Ihres Programms gezielt testen.

        Auf der **Station** läuft Ihr Programm auf dem realen Calliope mini, den Sie über die Kamera sehen. Dort können Sie die Sensorwerte nicht verändern: Die Raumtemperatur ist nahezu konstant, die Beleuchtung der Station ist eingeschaltet, solange jemand im Raum ist, und die Taster lassen sich aus der Ferne nicht drücken. Entwickeln und testen Sie die Logik Ihres Programms deshalb im Simulator, und prüfen Sie auf der Station, ob es auf der realen Hardware läuft und plausible Messwerte liefert.

        ## Technische Basis

        Die Umsetzung erfolgt auf dem Calliope mini 3.

        | Bauteil          | Funktion                  |
        | ---------------- | ------------------------- |
        | Nordic nRF52820  | Interface-Prozessor       |
        | Nordic nRF52833  | Anwendungs-Prozessor      |
        | Lichtsensor      | Umweltdaten erfassen      |
        | Temperatursensor | Umweltdaten erfassen      |
        | LED-Matrix (5x5) | Ausgabe von Informationen |
        | RGB-LEDs (3x)    | Ausgabe von Informationen |
        | Taster (2x)      | Benutzerinteraktion       |
        | Bluetooth-Modul  | Kommunikation             |

        Für zusätzliche Informationen und technische Details zum Calliope mini:

        * [Calliope mini Übersicht](https://calliope.cc/calliope-mini/uebersicht)
        * [Calliope mini MicroPython API](https://calliope.cc/programmieren/editoren/python/python-api)
