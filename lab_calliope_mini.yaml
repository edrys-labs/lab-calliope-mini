        # Calliope Mini Lab – Einführung in MicroPython & Sensorik

        Liebe Teilnehmerinnen und Teilnehmer,

        dieses Laborpraktikum bietet Ihnen die Möglichkeit, den Einstieg in die Programmierung eingebetteter Systeme mit MicroPython zu erlernen – direkt am Beispiel des Calliope mini.

        Im Mittelpunkt steht eine Wetteranzeige: Sie erfassen Umweltdaten mit den Sensoren des Calliope mini, stellen sie auf der LED-Matrix dar und erkennen starke Temperaturänderungen. Darüber hinaus können Sie die Anwendung mit eigenen Ideen erweitern.

        Sie können Ihre Programme direkt aus dem Editor heraus auf das reale Gerät hochladen und testen. Bitte beachten Sie, ob bereits jemand an der Station arbeitet, bevor Sie Ihren Code hochladen. Der letzte Programmzustand bleibt erhalten, also verlassen Sie die Station bitte in einem nachvollziehbaren Zustand.

        In **Raum 1** erhalten Sie grundlegende Informationen zum Calliope mini und zu den Lernzielen dieses Labors. In **Raum 2** entwickeln und testen Sie Ihr Programm im Simulator, in dem Sie Temperatur und Helligkeit selbst einstellen können. Auf der **Station** führen Sie es anschließend auf dem realen Calliope mini aus.

        Bei Fragen oder technischen Problemen steht Ihnen unser Betreuungsteam selbstverständlich zur Seite.

        > Ihre Codeänderungen werden auf der Station **anonymisiert** gespeichert. Wir wollen damit tatsächliche Problemfelder identifizieren, um damit die Veranstaltung systematisch weiterzuentwickeln. Aus den Daten können keine Rückschlüsse auf den Teilnehmenden oder spezifika des Rechners gezogen werden. Wenn Sie Fragen dazu haben, sprechen Sie uns gern an.

        Wir freuen uns auf Ihr Feedback und Ihre Anregungen.

        _Ihr CrossLab Team_
